server:
  port: 8082

spring:
  application:
    name: billing-service
  datasource:
    username: ${POSTGRES_BILLING_USER:billing_user}
    password: ${POSTGRES_BILLING_PASSWORD:billing_pass}
  flyway:
    placeholders:
      seed: 'false'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  kafka:
    consumer:
      group-id: billing-service
      auto-offset-reset: earliest
  web:
    locale: pt-BR
    locale-resolver: fixed

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# An outer circuit breaker counts one outcome per batch. Each retry has its own timeout.
resilience4j:
  circuitbreaker:
    circuitBreakerAspectOrder: 1
    instances:
      stockService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
  retry:
    retryAspectOrder: 2
    instances:
      stockService:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  timelimiter:
    timeLimiterAspectOrder: 3
    instances:
      stockService:
        timeoutDuration: 2s

invoice:
  stock:
    base-url: ${STOCK_SERVICE_URL:http://localhost:8081}
  kafka:
    topics:
      - name: stock.debit-requested
        partitions: 3
      - name: stock.debit-confirmed
        partitions: 3
      - name: stock.debit-rejected
        partitions: 3

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5434/billing_db
  kafka:
    bootstrap-servers: localhost:9092

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres-billing:5432/billing_db
  kafka:
    bootstrap-servers: kafka:9092

invoice:
  stock:
    base-url: ${STOCK_SERVICE_URL:http://stock-service:8081}

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    placeholders:
      seed: 'true'

---
spring:
  config:
    activate:
      on-profile: test
  kafka:
    admin:
      fail-fast: true
