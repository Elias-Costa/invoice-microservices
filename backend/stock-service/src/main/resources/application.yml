server:
  port: 8081

spring:
  application:
    name: stock-service
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    username: ${POSTGRES_STOCK_USER:stock_user}
    password: ${POSTGRES_STOCK_PASSWORD:stock_pass}
  flyway:
    placeholders:
      seed: 'false'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  kafka:
    consumer:
      group-id: stock-service
      auto-offset-reset: earliest
  web:
    locale: pt-BR
    locale-resolver: fixed

management:
  endpoints:
    web:
      exposure:
        include: health,info

invoice:
  kafka:
    topics:
      - name: stock.debit-requested
        partitions: 3
      - name: stock.debit-confirmed
        partitions: 3
      - name: stock.debit-rejected
        partitions: 3

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/stock_db
  kafka:
    bootstrap-servers: localhost:9092

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres-stock:5432/stock_db
  kafka:
    bootstrap-servers: kafka:9092

---
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    placeholders:
      seed: 'true'

---
spring:
  config:
    activate:
      on-profile: test
  kafka:
    admin:
      fail-fast: true
