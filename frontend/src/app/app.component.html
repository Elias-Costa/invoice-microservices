<mat-toolbar class="topbar">
  @if (compact()) {
    <button
      mat-icon-button
      type="button"
      class="menu-toggle"
      aria-label="Menu principal"
      aria-controls="navigation-drawer"
      [attr.aria-expanded]="drawer.opened"
      (click)="drawer.toggle()"
    >
      <span class="toggle-icon" aria-hidden="true"></span>
    </button>
  }
  <span class="brand-mark" aria-hidden="true"></span>
  <span class="brand-name">Notas Fiscais</span>
</mat-toolbar>

@if (apiActivity.loading()) {
  <mat-progress-bar mode="indeterminate" aria-label="Carregando dados" />
}

<div class="connection-status" role="status">
  @if (apiActivity.disconnected()) {
    <p>Sem conexão com o servidor</p>
  }
</div>

<mat-sidenav-container class="workspace">
  <mat-sidenav
    #drawer
    id="navigation-drawer"
    class="sidenav"
    [mode]="compact() ? 'over' : 'side'"
    [opened]="!compact()"
  >
    <mat-nav-list class="navigation" aria-label="Navegação principal">
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="compact() && drawer.close()"
      >
        <span matListItemIcon class="nav-icon overview" aria-hidden="true"></span>
        <span matListItemTitle>Visão geral</span>
      </a>

      <a
        mat-list-item
        routerLink="/products"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        (click)="compact() && drawer.close()"
      >
        <span matListItemIcon class="nav-icon products" aria-hidden="true"></span>
        <span matListItemTitle>Produtos</span>
      </a>

      <a
        mat-list-item
        routerLink="/customers"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        (click)="compact() && drawer.close()"
      >
        <span matListItemIcon class="nav-icon customers" aria-hidden="true"></span>
        <span matListItemTitle>Clientes</span>
      </a>

      <a
        mat-list-item
        routerLink="/invoices"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        (click)="compact() && drawer.close()"
      >
        <span matListItemIcon class="nav-icon invoices" aria-hidden="true"></span>
        <span matListItemTitle>Notas fiscais</span>
      </a>

      <a mat-list-item disabled role="link">
        <span matListItemIcon class="nav-icon status" aria-hidden="true"></span>
        <span matListItemTitle>Status do sistema</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content id="workspace-content" role="main" class="content">
    <div class="content-inner">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
